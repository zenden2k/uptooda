name: Build Uptooda

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  CONAN_REMOTE_NAME: zenden2k
  CONAN_REMOTE_URL: https://conan.svistunov.dev
  CONAN_LOGIN_USERNAME_ZENDEN2K: ${{ secrets.CONAN_LOGIN_USERNAME_ZENDEN2K }}
  CONAN_PASSWORD_ZENDEN2K: ${{ secrets.CONAN_PASSWORD_ZENDEN2K }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            platform: windows
            arch: x86
            artifact: windows-x86
            conan_build_profile: windows_vs2022_x64
          - name: Windows x64
            platform: windows
            arch: x86_64
            artifact: windows-x64
            conan_build_profile: windows_vs2022_x64
          - name: Windows ARM64
            platform: windows
            arch: armv8
            artifact: windows-arm64
            conan_build_profile: windows_vs2022_x64
          - name: Linux amd64
            platform: linux
            arch: x86_64
            artifact: linux-amd64
            conan_build_profile: default
          - name: Linux arm64
            platform: linux
            arch: aarch64
            artifact: linux-arm64
            conan_build_profile: default

    defaults:
      run:
        shell: pwsh

    env:
      UPTOODA_BUILD_RELEASE: ${{ github.event_name == 'release' && '1' || '0' }}
      UPTOODA_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      UPTOODA_BUILD_COMMIT: ${{ github.event_name != 'release' && github.sha || '' }}
      UPTOODA_BUILD_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
      UPTOODA_BUILD_PARALLEL_JOBS: 4
      UPTOODA_BUILD_UPLOAD_TO_DRDUMP: 0
      UPTOODA_BUILD_WINDOWS_CMAKE_GENERATOR: Visual Studio 17 2022
      UPTOODA_BUILD_DEFAULT_BUILD_PROFILE: ${{ matrix.conan_build_profile }}
      UPTOODA_BUILD_CONAN_PROFILES_PATH: ../Conan/Profiles
      UPTOODA_BUILD_WINDOWS_HOST_PROFILE_X86: windows_vs2022_x86_release
      UPTOODA_BUILD_WINDOWS_HOST_PROFILE_X64: windows_vs2022_x64
      UPTOODA_BUILD_WINDOWS_HOST_PROFILE_ARM64: windows_vs2022_arm64_release
      WSLENV: UPTOODA_BUILD_WSL_CONAN_HOME/p

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set WSL Conan cache path
        run: |
          $env:UPTOODA_BUILD_WSL_CONAN_HOME = Join-Path $env:GITHUB_WORKSPACE ".conan2-wsl"
          "UPTOODA_BUILD_WSL_CONAN_HOME=$env:UPTOODA_BUILD_WSL_CONAN_HOME" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup newer CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.0'

      - name: Setup WSL Ubuntu
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          use-cache: true

      - name: Cache Windows Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-windows-${{ runner.os }}-${{ matrix.artifact }}-${{ hashFiles('Source/conanfile.py', 'Conan/Profiles/**', 'Conan/Toolchains/**') }}
          restore-keys: |
            conan2-windows-${{ runner.os }}-${{ matrix.artifact }}-
            conan2-windows-${{ runner.os }}-

      - name: Cache WSL Conan packages
        uses: actions/cache@v4
        with:
          path: .conan2-wsl
          key: conan2-wsl-${{ runner.os }}-${{ matrix.artifact }}-${{ hashFiles('Source/conanfile.py', 'Conan/Profiles/**', 'Conan/Toolchains/**') }}
          restore-keys: |
            conan2-wsl-${{ runner.os }}-${{ matrix.artifact }}-
            conan2-wsl-${{ runner.os }}-

      - name: Install Python dependencies
        working-directory: Dist
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt conan

      - name: Configure Windows Conan remote
        run: |
          conan remote add $env:CONAN_REMOTE_NAME $env:CONAN_REMOTE_URL --index 0 --force
          if ($env:CONAN_LOGIN_USERNAME_ZENDEN2K -and $env:CONAN_PASSWORD_ZENDEN2K) {
            conan remote login $env:CONAN_REMOTE_NAME $env:CONAN_LOGIN_USERNAME_ZENDEN2K -p $env:CONAN_PASSWORD_ZENDEN2K
          }

      - name: Install WSL dependencies
        run: |
          $env:WSLENV = "CI/u:GITHUB_ACTIONS/u:UPTOODA_BUILD_WSL_CONAN_HOME/p"
          $workspace = $env:GITHUB_WORKSPACE
          $wslWorkspace = "/mnt/" + $workspace.Substring(0, 1).ToLowerInvariant() + "/" + $workspace.Substring(3).Replace('\', '/')
          wsl -- bash "$wslWorkspace/Dist/bootstrap-wsl.sh"

      - name: Configure WSL Conan remote
        run: |
          $env:WSLENV = "CONAN_REMOTE_NAME/u:CONAN_REMOTE_URL/u:CONAN_LOGIN_USERNAME_ZENDEN2K/u:CONAN_PASSWORD_ZENDEN2K/u:UPTOODA_BUILD_WSL_CONAN_HOME/p"
          wsl -- bash -lc 'export PATH="$HOME/.local/bin:$PATH"; export CONAN_HOME="$UPTOODA_BUILD_WSL_CONAN_HOME"; conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --index 0 --force'
          if ($env:CONAN_LOGIN_USERNAME_ZENDEN2K -and $env:CONAN_PASSWORD_ZENDEN2K) {
            wsl -- bash -lc 'export PATH="$HOME/.local/bin:$PATH"; export CONAN_HOME="$UPTOODA_BUILD_WSL_CONAN_HOME"; conan remote login "$CONAN_REMOTE_NAME" "$CONAN_LOGIN_USERNAME_ZENDEN2K" -p "$CONAN_PASSWORD_ZENDEN2K"'
          }

      - name: Build package
        working-directory: Dist
        run: python build.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --branch $env:UPTOODA_BUILD_BRANCH

      - name: Upload package artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.artifact }}
          path: Dist/Packages/**
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t files < <(find release-assets -type f \
            ! -name 'build_info.json' \
            ! -name 'builds.json' \
            ! -name 'iu_core*.xml' \
            ! -name 'iu_serversinfo*.xml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
