name: Conan Dependency Submission

on:
  push:
    branches: [master]
    paths:
      - 'Source/conanfile.py'
      - '.github/workflows/conan-dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONAN_REMOTE_NAME: zenden2k
  CONAN_REMOTE_URL: https://conan.svistunov.dev
  CONAN_LOGIN_USERNAME_ZENDEN2K: ${{ secrets.CONAN_LOGIN_USERNAME_ZENDEN2K }}
  CONAN_PASSWORD_ZENDEN2K: ${{ secrets.CONAN_PASSWORD_ZENDEN2K }}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install conan
      - name: Configure Conan remote
        run: |
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --index 0 --force
          if [ -n "$CONAN_LOGIN_USERNAME_ZENDEN2K" ] && [ -n "$CONAN_PASSWORD_ZENDEN2K" ]; then
            conan remote login "$CONAN_REMOTE_NAME" "$CONAN_LOGIN_USERNAME_ZENDEN2K" -p "$CONAN_PASSWORD_ZENDEN2K"
          fi
#      - uses: advanced-security/conan-dependency-submission@v1
      - uses: zenden2k/conan-dependency-submission@fix-user-channel
        with:
          conanfile: Source/conanfile.py
          conan-version: 2.27.1